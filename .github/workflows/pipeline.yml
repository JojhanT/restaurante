# Pipeline CI/CD del SIGR.
# Etapas: calidad -> (pruebas | seguridad) -> construcción -> despliegue a staging -> verificación.
# En cualquier rama corren las cuatro primeras; solo main despliega a GitHub Pages (staging).
name: Pipeline CI/CD

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  calidad:
    name: 1 · Calidad de código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Análisis estático (ESLint)
        run: npm run lint

  pruebas:
    name: 2 · Pruebas y cobertura
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas unitarias e integración con umbral de cobertura
        run: npm run test:ci
      - name: Resumen de cobertura
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const fila = (n, k) => `| ${n} | ${t[k].pct} % | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Cobertura de src/domain", "", "| Métrica | Cobertura | Cubiertas |", "|---|---|---|",
              fila("Líneas", "lines"), fila("Sentencias", "statements"), fila("Funciones", "functions"), fila("Ramas", "branches")].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: |
            reports/
            coverage/
          retention-days: 14

  seguridad:
    name: 3 · Seguridad
    needs: calidad
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Auditoría de dependencias (falla con severidad alta o crítica)
        run: npm run audit
      - name: Preparar análisis de código (CodeQL)
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Análisis de vulnerabilidades en el código (CodeQL)
        uses: github/codeql-action/analyze@v4
        with:
          output: resultados-codeql
      # CodeQL publica las alertas pero no detiene el pipeline; este paso sí lo hace.
      - name: Bloquear si CodeQL encuentra alertas
        run: |
          total=$(jq '[.runs[].results[]] | length' resultados-codeql/*.sarif)
          echo "Alertas de CodeQL: $total"
          echo "### CodeQL: $total alertas" >> "$GITHUB_STEP_SUMMARY"
          [ "$total" -eq 0 ]

  construccion:
    name: 4 · Construcción y rendimiento
    needs: [pruebas, seguridad]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Construir para producción
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Presupuesto de rendimiento (tamaño del paquete)
        run: npm run check:size
      - name: Empaquetar artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  staging:
    name: 5 · Despliegue a staging
    if: github.ref == 'refs/heads/main'
    needs: construccion
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    outputs:
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5

  verificacion:
    name: 6 · Verificación post-despliegue
    needs: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prueba de humo (disponibilidad, contenido y tiempo de respuesta)
        run: bash scripts/smoke-test.sh "${{ needs.staging.outputs.url }}" 2
